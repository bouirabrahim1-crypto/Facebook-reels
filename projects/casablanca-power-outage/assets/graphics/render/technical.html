<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="bg-wrap"><img id="bgimg" src="images/pylons.jpg"></div>
  <div class="scrim"></div>
  <div class="stage">
    <div class="eyebrow" id="eyebrow">المعلومة التقنية</div>
    <div class="card" id="card" style="margin-top:30px">
      <div class="value" style="font-size:100px">+225,000</div>
      <div class="label">فولط — خطوط النقل ذات الجهد العالي جداً</div>
      <div class="date">خلل في هذا المستوى من الشبكة يؤثر على أحياء بأكملها دفعة واحدة</div>
    </div>
  </div>
<script>
  function ease(x){ return 1 - Math.pow(1-x,3); }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function fadeUp(el, t, start, dur){
    const p = ease(clamp01((t-start)/dur));
    el.style.opacity = p;
    el.style.transform = 'translateY(' + (14 - 14*p) + 'px)';
  }
  function setTime(t){
    fadeUp(document.getElementById('eyebrow'), t, 0.2, 0.5);
    fadeUp(document.getElementById('card'), t, 0.8, 0.7);
    document.getElementById('bgimg').style.transform = 'scale(' + (1.0 + 0.05*clamp01(t/16.752)) + ')';
  }
  window.__setTime = setTime;
  setTime(0);
</script>
</body></html>

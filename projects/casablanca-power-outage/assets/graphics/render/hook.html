<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="bg-wrap"><img id="bgimg" src="images/casa_lights_night.jpg"></div>
  <div class="scrim"></div>
  <div class="stage">
    <div class="headline" id="line1" style="font-size:66px">
      الدار البيضاء، العاصمة الاقتصادية للمغرب...<br>
      <span style="color:var(--gold2)">وفجأة أحياء بأكملها تغرق في الظلام</span>
    </div>
    <div class="rule" id="rule"></div>
    <div class="headline" id="line2" style="font-size:52px;color:var(--fg)">
      هل يعاني المغرب من مشكلة في شبكة الكهرباء؟
    </div>
  </div>
<script>
  function ease(x){ return 1 - Math.pow(1-x,3); }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function fadeUp(el, t, start, dur){
    const p = ease(clamp01((t-start)/dur));
    el.style.opacity = p;
    el.style.transform = 'translateY(' + (16 - 16*p) + 'px)';
  }
  function setTime(t){
    fadeUp(document.getElementById('line1'), t, 0.2, 0.8);
    fadeUp(document.getElementById('rule'), t, 5.5, 0.5);
    fadeUp(document.getElementById('line2'), t, 6.2, 0.8);
    document.getElementById('bgimg').style.transform = 'scale(' + (1.0 + 0.05*clamp01(t/12.576)) + ')';
  }
  window.__setTime = setTime;
  setTime(0);
</script>
</body></html>

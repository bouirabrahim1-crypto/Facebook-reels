<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="bg-wrap"><img id="bgimg" src="images/tomato_price.png"></div>
  <div class="scrim"></div>
  <div class="stage">
    <div class="headline" id="headline" style="font-size:68px">
      ثمن الطماطم يرتفع في الأسواق المغربية...<br>
      <span style="color:var(--gold2)">فتتخذ الحكومة خطوة غير متوقعة</span>
    </div>
  </div>
<script>
  function ease(x){ return 1 - Math.pow(1-x,3); }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function setTime(t){
    const el = document.getElementById('headline');
    const p = ease(clamp01((t-0.2)/0.8));
    el.style.opacity = p;
    el.style.transform = 'scale(' + (0.97 + 0.03*p) + ')';
    document.getElementById('bgimg').style.transform = 'scale(' + (1.0 + 0.05*clamp01(t/8.016)) + ')';
  }
  window.__setTime = setTime;
  setTime(0);
</script>
</body></html>

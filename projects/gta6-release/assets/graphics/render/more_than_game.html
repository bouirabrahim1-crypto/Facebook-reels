<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  .frame{
    width:760px;height:420px;border-radius:28px;background:#ffffff;
    border:1px solid rgba(192,199,209,0.2);display:flex;align-items:center;justify-content:center;
    overflow:hidden;opacity:0;margin-bottom:40px;
  }
  .frame img{width:88%;height:88%;object-fit:contain}
</style>
</head>
<body>
  <div class="stage">
    <div class="eyebrow" id="eyebrow">أكثر من مجرد لعبة</div>
    <div class="frame" id="frame"><img src="images/more_than_game.png"></div>
    <div class="headline" id="headline" style="font-size:44px">
      محاولة لصناعة عالم<br>
      <span style="color:var(--gold2)">كل شارع وكل شخصية له حياة خاصة</span>
    </div>
  </div>
<script>
  function ease(x){ return 1 - Math.pow(1-x,3); }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function fadeUp(el, t, start, dur){
    const p = ease(clamp01((t-start)/dur));
    el.style.opacity = p;
    el.style.transform = 'translateY(' + (14 - 14*p) + 'px)';
  }
  function setTime(t){
    fadeUp(document.getElementById('eyebrow'), t, 0.2, 0.5);
    fadeUp(document.getElementById('frame'), t, 0.6, 0.6);
    fadeUp(document.getElementById('headline'), t, 1.4, 0.7);
  }
  window.__setTime = setTime;
  setTime(0);
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Cairo'; font-weight: 400; src: url('fonts/Cairo-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'Cairo'; font-weight: 700; src: url('fonts/Cairo-Bold.ttf') format('truetype'); }
  @font-face { font-family: 'Montserrat'; font-weight: 700; src: url('fonts/Montserrat-Bold.ttf') format('truetype'); }
  :root{
    --navy:#070D1A; --gold:#C9A54C; --gold2:#E6C77A; --silver:#C0C7D1; --fg:#E8ECF1; --alert:#E0392B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:1080px;height:1920px;background:var(--navy);overflow:hidden;font-family:'Cairo',Arial,sans-serif}
  .panel{position:absolute;top:0;left:0;width:1080px;height:1920px;opacity:0}
  .panel img{width:100%;height:100%;object-fit:cover;display:block}
  .scrim{position:absolute;top:0;left:0;width:1080px;height:1920px;
    background:linear-gradient(180deg, rgba(7,13,26,0.55) 0%, rgba(7,13,26,0.35) 45%, rgba(7,13,26,0.88) 100%);}
  .caption-wrap{position:absolute;bottom:160px;left:0;width:1080px;padding:0 70px;text-align:center}
  .caption{font-weight:700;font-size:52px;line-height:1.4;color:var(--fg);
    text-shadow:0 2px 10px rgba(0,0,0,0.6)}
  .caption .hl{color:var(--gold2)}
  .stat-card{
    position:absolute;bottom:420px;left:140px;width:800px;
    background:rgba(7,13,26,0.85);border:1px solid rgba(192,199,209,0.25);border-radius:24px;
    padding:36px 40px;opacity:0;text-align:center;
  }
  .stat-card .row{display:flex;justify-content:space-around;margin-bottom:10px}
  .stat-card .num{font-family:'Montserrat',Arial,sans-serif;font-weight:700;font-size:64px;color:var(--gold2)}
  .stat-card .lbl{font-size:28px;color:var(--silver);margin-top:4px}
</style>
</head>
<body>
  <!-- Scene 1: hook 0 - 10.3 -->
  <div class="panel" id="p1"><img src="images/118877.jpg"></div>
  <!-- Scene 2: الفرقة الوطنية 10.3 - 16.6 -->
  <div class="panel" id="p2"><img src="images/118876.jpg"></div>
  <!-- Scene 3: الخطة 16.6 - 29.44 -->
  <div class="panel" id="p3"><img src="images/118878.jpg"></div>
  <!-- Scene 4: الفخ 29.44 - 37.6 -->
  <div class="panel" id="p4"><img src="images/118873.jpg"></div>
  <!-- Scene 5: الإعلام 37.6 - 44.48 -->
  <div class="panel" id="p5"><img src="images/118871.jpg"></div>
  <!-- Scene 6: الخيانة 44.48 - 48.42 -->
  <div class="panel" id="p6"><img src="images/118870.jpg"></div>
  <!-- Scene 7: القانون 48.42 - 54.44 -->
  <div class="panel" id="p7"><img src="images/118869.jpg"></div>
  <!-- Scene 8: دعوة للمشاركة 54.44 - end -->
  <div class="panel" id="p8"><img src="images/118872.jpg"></div>

  <div class="scrim"></div>

  <div class="caption-wrap"><div class="caption" id="caption"></div></div>

  <div class="stat-card" id="statcard">
    <div class="row">
      <div><div class="num">182</div><div class="lbl">ملف مسجل</div></div>
      <div><div class="num">137</div><div class="lbl">مشتبه به</div></div>
    </div>
    <div class="lbl" style="margin-top:14px">العقوبة: الحبس + غرامة تصل لـ40.000 درهم</div>
  </div>

<script>
  const captions = [
    {start:0.0, end:10.3, text: 'خمسة آلاف ضحية وملايير السنتيمات طارت فالهوا فالمغرب...<br><span class="hl">غير بسباب إشهارات ديال الربح السريع!</span>'},
    {start:10.3, end:16.6, text: 'هاد الأيام تفجرات فضيحة كبرى ديال التسويق الهرمي<br>خلات <span class="hl">الفرقة الوطنية</span> تدخل على الخط'},
    {start:16.6, end:29.44, text: 'الخطة كانت ساهلة: شركة مسجلة برأسمال رمزي ديال 50.000 درهم...<br>كتوعدك بمتجر إلكتروني ومرابيح خيالية<br>غير تخلص ما بين <span class="hl">3.000 و5.000 درهم</span>'},
    {start:29.44, end:37.6, text: 'ولكن ملي كتدخل، كتلقى <span class="hl">متجر خاوي</span> بلا مبيعات حقيقية...<br>وباش ترجع فلوسك، خاصك تجيب خمسة ولا ستة آخرين!'},
    {start:37.6, end:44.48, text: 'اللي خطير أكثر؟ القصة وصلات للتلفزة<br>ولحسابات <span class="hl">مؤثرات وفنانات</span> داروا الإشهار بلا ما يتأكدو'},
    {start:44.48, end:48.42, text: 'وملي الناس طالبو بفلوسهم،<br>لقاو <span class="hl">البلوك فواتساب</span> وختفاو الوعود!'},
    {start:48.42, end:54.44, text: 'القانون المغربي واضح: <span class="hl">المادة 58</span><br>من قانون حماية المستهلك كتمنع البيع الهرمي'},
    {start:54.44, end:66.0, text: 'فأي مشروع كيطلب منك تجيب ناس باش تربح... <span class="hl">هرب!</span><br>شارك الفيديو باش توعي غيرك'}
  ];
  const panels = ['p1','p2','p3','p4','p5','p6','p7','p8'];
  const bounds = [0, 10.3, 16.6, 29.44, 37.6, 44.48, 48.42, 54.44, 66.0];

  function ease(x){ return 1 - Math.pow(1-x,3); }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }

  function setTime(t){
    for (let i = 0; i < panels.length; i++) {
      const el = document.getElementById(panels[i]);
      const start = bounds[i], end = bounds[i+1];
      const fadeIn = ease(clamp01((t-start)/0.4));
      const fadeOut = 1 - ease(clamp01((t-(end-0.4))/0.4));
      let op = 0;
      if (t >= start - 0.4 && t <= end + 0.1) {
        op = Math.min(fadeIn, fadeOut);
      }
      el.style.opacity = Math.max(0, op);
      const dur = end - start;
      el.querySelector('img').style.transform = 'scale(' + (1.0 + 0.04*clamp01((t-start)/dur)) + ')';
    }

    let activeCap = null;
    for (const c of captions) { if (t >= c.start && t < c.end) { activeCap = c; break; } }
    const capEl = document.getElementById('caption');
    if (activeCap) {
      capEl.innerHTML = activeCap.text;
      const p = Math.min(ease(clamp01((t-activeCap.start)/0.4)), 1 - ease(clamp01((t-(activeCap.end-0.4))/0.4)));
      capEl.style.opacity = Math.max(0, p);
    } else {
      capEl.style.opacity = 0;
    }

    const statStart = 50.5, statEnd = 54.2;
    const statCard = document.getElementById('statcard');
    const sp = Math.min(ease(clamp01((t-statStart)/0.5)), 1 - ease(clamp01((t-(statEnd-0.5))/0.5)));
    statCard.style.opacity = (t >= statStart && t <= statEnd) ? Math.max(0, sp) : 0;
  }
  window.__setTime = setTime;
  setTime(0);
</script>
</body></html>

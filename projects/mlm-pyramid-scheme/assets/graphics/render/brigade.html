<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="bg-wrap"><img id="bgimg" src="images/118876.jpg"></div>
  <div class="scrim"></div>
  <div class="stage">
    <div class="headline" id="headline" style="font-size:50px">
      هاد الأيام تفجرات فضيحة كبرى<br>
      ديال التسويق الهرمي
    </div>
    <div class="body-text" id="tail" style="font-size:36px;margin-top:20px;color:var(--gold2);font-weight:700">
      خلات الفرقة الوطنية تدخل على الخط
    </div>
  </div>
<script>
  function ease(x){ return 1 - Math.pow(1-x,3); }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function fadeUp(el, t, start, dur){
    const p = ease(clamp01((t-start)/dur));
    el.style.opacity = p;
    el.style.transform = 'translateY(' + (14 - 14*p) + 'px)';
  }
  function setTime(t){
    fadeUp(document.getElementById('headline'), t, 0.2, 0.5);
    fadeUp(document.getElementById('tail'), t, 2.4, 0.5);
    document.getElementById('bgimg').style.transform = 'scale(' + (1.0 + 0.05*clamp01(t/6.296)) + ')';
  }
  window.__setTime = setTime;
  setTime(0);
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="bg-wrap"><img id="bgimg" src="images/118872.jpg"></div>
  <div class="scrim"></div>
  <div class="stage">
    <div class="headline" id="headline" style="font-size:48px">
      فأي مشروع كيطلب منك<br>
      تجيب ناس باش تربح...<br>
      <span style="color:var(--alert);font-weight:700">هرب!</span>
    </div>
    <div class="body-text" id="tail" style="font-size:38px;margin-top:24px;color:var(--gold2);font-weight:700">
      شارك الفيديو باش توعي غيرك
    </div>
  </div>
<script>
  function ease(x){ return 1 - Math.pow(1-x,3); }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function fadeUp(el, t, start, dur){
    const p = ease(clamp01((t-start)/dur));
    el.style.opacity = p;
    el.style.transform = 'translateY(' + (14 - 14*p) + 'px)';
  }
  function setTime(t){
    fadeUp(document.getElementById('headline'), t, 0.2, 0.6);
    fadeUp(document.getElementById('tail'), t, 4.5, 0.6);
    document.getElementById('bgimg').style.transform = 'scale(' + (1.0 + 0.05*clamp01(t/10.815)) + ')';
  }
  window.__setTime = setTime;
  setTime(0);
</script>
</body></html>

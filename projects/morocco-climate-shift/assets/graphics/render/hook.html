<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  .word{position:absolute;top:0;left:0;width:1080px;height:1920px;display:flex;align-items:center;justify-content:center;
        font-weight:700;font-size:92px;color:var(--fg);opacity:0;text-align:center;z-index:2}
  .word .inner{width:900px;line-height:1.3}
  .word .accent{color:var(--gold2)}
  .word .warn{color:var(--alert)}
  .bg{position:absolute;top:0;left:0;width:1080px;height:1920px;opacity:0;z-index:0}
  .bg img{width:100%;height:100%;object-fit:cover;display:block}
</style></head>
<body>
  <div class="bg" id="bg1"><img src="images/sahara_dunes.jpg"></div>
  <div class="bg" id="bg2"><img src="images/flood_khenifra_1.jpg"></div>
  <div class="bg" id="bg3"><img src="images/orange_sun.jpg"></div>
  <div class="scrim"></div>

  <div class="word" id="w1"><div class="inner">جفاف دام <span class="accent">سبع سنوات</span>...</div></div>
  <div class="word" id="w2"><div class="inner">ينتهي بـ<span class="warn">فيضانات قاتلة</span></div></div>
  <div class="word" id="w3"><div class="inner">ثم بصيف <span class="accent">قياسي في الحرارة</span></div></div>
<script>
  function ease(x){ return 1 - Math.pow(1-x,3); }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  const SEGS = [[0.0,2.9],[3.0,5.8],[5.9,8.424]];
  function segOpacity(t, seg){
    const [a,b] = seg;
    const fadeIn = ease(clamp01((t-a)/0.35));
    const fadeOut = 1 - ease(clamp01((t-(b-0.35))/0.35));
    if (t < a || t > b) return 0;
    return Math.min(fadeIn, fadeOut);
  }
  function setTime(t){
    const words = [document.getElementById('w1'), document.getElementById('w2'), document.getElementById('w3')];
    const bgs = [document.getElementById('bg1'), document.getElementById('bg2'), document.getElementById('bg3')];
    [words, bgs].forEach(group => {
      group.forEach((el, i) => {
        const o = segOpacity(t, SEGS[i]);
        el.style.opacity = o;
      });
    });
    words.forEach((el,i) => {
      const o = segOpacity(t, SEGS[i]);
      el.querySelector('.inner').style.transform = 'scale(' + (0.96 + 0.04*o) + ')';
    });
    bgs.forEach((el,i) => {
      const [a] = SEGS[i];
      const p = clamp01((t-a)/ (SEGS[i][1]-SEGS[i][0]));
      el.querySelector('img').style.transform = 'scale(' + (1.0 + 0.06*p) + ')';
    });
  }
  window.__setTime = setTime;
  setTime(0);
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
  .word{position:absolute;font-weight:700;font-size:92px;color:var(--fg);opacity:0;text-align:center;width:900px;line-height:1.3}
  .word .accent{color:var(--gold2)}
  .word .warn{color:var(--alert)}
</style></head>
<body>
  <div class="stage">
    <div class="word" id="w1">جفاف دام <span class="accent">سبع سنوات</span>...</div>
    <div class="word" id="w2">ينتهي بـ<span class="warn">فيضانات قاتلة</span></div>
    <div class="word" id="w3">ثم بصيف <span class="accent">قياسي في الحرارة</span></div>
  </div>
<script>
  function ease(x){ return 1 - Math.pow(1-x,3); }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  // three segments across the clip
  const SEGS = [[0.0,2.9],[3.0,5.8],[5.9,8.424]];
  function segOpacity(t, seg){
    const [a,b] = seg;
    const fadeIn = ease(clamp01((t-a)/0.35));
    const fadeOut = 1 - ease(clamp01((t-(b-0.35))/0.35));
    if (t < a || t > b) return 0;
    return Math.min(fadeIn, fadeOut);
  }
  function setTime(t){
    const els = [document.getElementById('w1'), document.getElementById('w2'), document.getElementById('w3')];
    els.forEach((el, i) => {
      const o = segOpacity(t, SEGS[i]);
      el.style.opacity = o;
      el.style.transform = 'scale(' + (0.96 + 0.04*o) + ')';
    });
  }
  window.__setTime = setTime;
  setTime(0);
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="common.css">
</head>
<body>
  <div class="bg-wrap"><img id="bgimg" src="images/red_black.jpg"></div>
  <div class="scrim"></div>
  <div class="stage">
    <div class="eyebrow" id="eyebrow">الأحمر والأسود</div>
    <div class="headline" id="headline" style="font-size:52px;margin-top:20px">
      لاحقاً، ربط التجار الاسم بالأرباح
    </div>
    <div class="body-text" id="tail" style="font-size:36px;margin-top:20px">
      <span style="color:#E07A6E">الأحمر</span> للخسائر، و<span style="color:var(--gold2)">الأسود</span> للأرباح
    </div>
  </div>
<script>
  function ease(x){ return 1 - Math.pow(1-x,3); }
  function clamp01(x){ return Math.max(0, Math.min(1, x)); }
  function fadeUp(el, t, start, dur){
    const p = ease(clamp01((t-start)/dur));
    el.style.opacity = p;
    el.style.transform = 'translateY(' + (14 - 14*p) + 'px)';
  }
  function setTime(t){
    fadeUp(document.getElementById('eyebrow'), t, 0.2, 0.5);
    fadeUp(document.getElementById('headline'), t, 1.0, 0.7);
    fadeUp(document.getElementById('tail'), t, 2.6, 0.6);
    document.getElementById('bgimg').style.transform = 'scale(' + (1.0 + 0.06*clamp01(t/9.768)) + ')';
  }
  window.__setTime = setTime;
  setTime(0);
</script>
</body></html>

<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <!-- Lower-third template — overlay on top of footage at the frame's lower third.
       Replace {{TITLE}} and {{SUBTITLE}} tokens when generating a real caption. -->
  <g transform="translate(0,1480)">
    <rect x="0" y="0" width="680" height="110" fill="#070D1A" opacity="0.88"/>
    <rect x="0" y="0" width="6" height="110" fill="#C9A54C"/>
    <text x="40" y="48" font-family="Cairo, Arial, sans-serif" font-weight="700"
          font-size="36" fill="#E8ECF1">{{TITLE}}</text>
    <text x="40" y="88" font-family="IBM Plex Sans Arabic, Arial, sans-serif" font-weight="400"
          font-size="24" fill="#C0C7D1">{{SUBTITLE}}</text>
  </g>
</svg>

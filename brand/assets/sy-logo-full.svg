<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C77A"/>
      <stop offset="100%" stop-color="#C9A54C"/>
    </linearGradient>
    <linearGradient id="silverGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECF1"/>
      <stop offset="100%" stop-color="#C0C7D1"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" fill="#070D1A"/>

  <!-- monogram -->
  <g transform="translate(40,30)">
    <circle cx="100" cy="100" r="95" fill="none" stroke="#C0C7D1" stroke-width="2" opacity="0.55"/>
    <text x="75" y="135" font-family="Montserrat, Arial, sans-serif" font-weight="700"
          font-size="105" fill="url(#goldGrad2)" text-anchor="middle">S</text>
    <text x="135" y="135" font-family="Montserrat, Arial, sans-serif" font-weight="700"
          font-size="105" fill="url(#silverGrad2)" text-anchor="middle" opacity="0.92">Y</text>
  </g>

  <!-- wordmark -->
  <text x="270" y="140" font-family="Montserrat, Arial, sans-serif" font-weight="700"
        font-size="64" letter-spacing="2" fill="#E8ECF1">SKAMS <tspan fill="url(#goldGrad2)">YAMS</tspan></text>

  <!-- tagline -->
  <text x="272" y="185" font-family="Cairo, Arial, sans-serif" font-weight="400"
        font-size="26" fill="#C0C7D1">انظر أبعد... افهم أكثر</text>
</svg>

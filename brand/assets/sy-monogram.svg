<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#0B1426"/>
      <stop offset="100%" stop-color="#070D1A"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C77A"/>
      <stop offset="100%" stop-color="#C9A54C"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8ECF1"/>
      <stop offset="100%" stop-color="#C0C7D1"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- lens ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#C0C7D1" stroke-width="2" opacity="0.55"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#C9A54C" stroke-width="1" opacity="0.35"/>

  <!-- lens ticks, evoking a camera iris -->
  <g stroke="#C0C7D1" stroke-width="2" opacity="0.4">
    <line x1="200" y1="50" x2="200" y2="62"/>
    <line x1="200" y1="338" x2="200" y2="350"/>
    <line x1="50" y1="200" x2="62" y2="200"/>
    <line x1="338" y1="200" x2="350" y2="200"/>
  </g>

  <!-- S : gold, geometric -->
  <text x="150" y="245" font-family="Montserrat, Arial, sans-serif" font-weight="700"
        font-size="190" fill="url(#goldGrad)" text-anchor="middle">S</text>

  <!-- Y : silver, geometric, interlocked offset to the right and slightly behind S -->
  <text x="255" y="245" font-family="Montserrat, Arial, sans-serif" font-weight="700"
        font-size="190" fill="url(#silverGrad)" text-anchor="middle" opacity="0.92">Y</text>
</svg>
